<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c0e2b">
  <title>Pizza da Lara 🍕</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="enfeites" aria-hidden="true">🌮 🍕 🧀 🔥 🍕 🌮 🧀</div>
  <main class="cartao">
    <div class="mascote" aria-hidden="true">🍕</div>
    <h1>PIZZA DE DORITOS<br><span>DA LARINHA</span></h1>
    <p class="subtitulo">Ta chegando o dia de entregar a pizza da <strong>Larinha</strong> Rafa</p>
    <div class="aviso">⚠️ CUIDADO Q A LARA VAI COBRAR. ⚠️</div>
    <p class="titulo-cronometro">TEMPO RESTANTE PRA FAZER A BOA:</p>
    <div class="contagem-regressiva" role="timer" aria-label="Contagem regressiva até 20 de novembro de 2026">
      <div class="unidade"><strong id="dias">00</strong><span>DIAS</span></div>
      <div class="unidade"><strong id="horas">00</strong><span>HORAS</span></div>
      <div class="unidade"><strong id="minutos">00</strong><span>MINUTOS</span></div>
      <div class="unidade"><strong id="segundos">00</strong><span>SEGUNDOS</span></div>
    </div>
    <div class="rodape">📅 16/10/2026 • 23h e alguma coisa (Rua Siderópolis)<br>Lara™</div>
  </main>
</body>
</html>
